[workspace]
members = ["crates/core", "crates/cli", "crates/ui"]
resolver = "3"

[workspace.package]
version = "0.1.1"
edition = "2024"
license = "MIT"
repository = "https://github.com/v0l/cycler"
description = "Cell-level battery cycle testing: charge, discharge and capacity measurement"

[workspace.dependencies]
cycler-core = { path = "crates/core" }
battery_control = { git = "https://github.com/v0l/battery-control", features = [
    "pylontech-cli",
    "pylontech-rs485",
    "seplos",
    "pace",
    "daly",
    "jk-serial",
    "jbd-serial",
    "jk-ble",
    "jbd-ble",
    "sok",
    "renogy",
] }
anyhow = "1.0"
chrono = "0.4"
clap = { version = "4.6", features = ["derive"] }
nusb = "0.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serialport = "4.10"
tokio = { version = "1", features = ["rt", "time", "macros"] }
